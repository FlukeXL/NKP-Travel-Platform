<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Ad Display</title>
  <style>
    body { font-family: sans-serif; padding: 50px; background: #eee; }
    #ad-box { background: white; padding: 20px; border: 2px solid green; text-align: center; }
    img { max-height: 200px; }
  </style>
  <script src="js/security.js?v=44"></script>
</head>
<body>
  <h1>Test Ad Display</h1>
  <div id="ad-box">Loading...</div>
  <script>
    fetch('http://localhost:4000/api/sponsors/active')
      .then(res => res.json())
      .then(data => {
        if(data.success && data.data.length > 0) {
          const ad = data.data[0];
          document.getElementById('ad-box').innerHTML = '<img src="http://localhost:4000' + ad.imageUrl + '" /><br><p>Loaded: ' + ad.title + '</p>';
        } else {
          document.getElementById('ad-box').innerHTML = 'No active ads found.';
        }
      })
      .catch(err => {
        document.getElementById('ad-box').innerHTML = '<h2 style="color:red">Error: ' + err.message + '</h2><p>This means your browser blocked the request.</p>';
      });
  </script>
</body>
</html>
