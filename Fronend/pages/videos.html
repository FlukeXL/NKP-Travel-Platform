<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>วิดีโอรีวิว | Nakhon Phanom Lifestyle Travel Platform</title>
  <meta name="description" content="รวมวิดีโอรีวิวสถานที่ท่องเที่ยวจริงจากนักท่องเที่ยวในนครพนม กดหัวใจ คอมเมนต์ และแชร์ได้" />

  <link rel="stylesheet" href="/Fronend/css/style.css?v=44" />
  <link rel="stylesheet" href="/Fronend/css/navbar.css?v=44" />
  <link rel="stylesheet" href="/Fronend/css/infobar.css?v=44" />
  <link rel="stylesheet" href="/Fronend/css/footer.css?v=44" />
  <link rel="stylesheet" href="/Fronend/css/attractions.css?v=44" />
  <link rel="stylesheet" href="/Fronend/css/videos.css?v=44" />
  <link rel="stylesheet" href="/Fronend/css/auth.css?v=44" />
  <link rel="stylesheet" href="/Fronend/css/place-modal.css?v=44" />
  <link rel="stylesheet" href="/Fronend/css/video-modal.css?v=44" />
  <link rel="stylesheet" href="/Fronend/css/responsive.css?v=44" />
  <link rel="stylesheet" href="/Fronend/css/mobile.css?v=44" />
  <link rel="stylesheet" href="/Fronend/css/ai-tour-guide.css?v=44" />
  <script src="../js/security.js?v=44"></script>
</head>
<body>

  <!-- ================= FLOATING HEADER (Navbar + Infobar) — desktop only ================= -->
  <div class="floating-header" id="site-floating-header" data-desktop-only>
    <div data-include="/Fronend/components/navbar.html"></div>
    <div data-include="/Fronend/components/infobar.html"></div>
  </div>

  <!-- ================= MOBILE SHELL (fully independent from desktop) ================= -->
  <div data-mobile-only>
    <div data-include="/Fronend/components/mobile-shell.html"></div>
  </div>

  <!-- ================= AUTH MODAL (login / register popup) — shared site-wide ================= -->
  <div data-include="/Fronend/components/auth-modal.html"></div>

  <!-- ================= PLACE DETAIL MODAL (shared site-wide) ================= -->
  <div data-include="/Fronend/components/place-modal.html"></div>

  <!-- ================= VIDEO PLAYER MODAL (shared site-wide) ================= -->
  <div data-include="/Fronend/components/video-modal.html"></div>

  <!-- ================= PAGE HERO ================= -->
  <section class="page-hero" id="page-hero">
    <img class="page-hero__img" src="/assets/images/hero/videos-hero.jpg" alt="วิดีโอรีวิวนครพนม" />
    <div class="page-hero__overlay"></div>
    <div class="page-hero__content">
      <div class="page-hero__breadcrumb">
        <a href="/Fronend/index.html">หน้าหลัก</a> <span>/</span> <span class="text-gold">วิดีโอรีวิว</span>
      </div>
      <h1 class="page-hero__title">วิดีโอรีวิว<em>สนุกๆ</em></h1>
      <p class="page-hero__subtitle">รีวิวจริงจากนักท่องเที่ยวจริง กดหัวใจ คอมเมนต์ และแชร์ให้เพื่อนดูได้เลย</p>
    </div>
  </section>

  <!-- ================= VIDEO FEED ================= -->
  <section class="videos-page">
    <div class="container">
      <div class="section-head fade-in">
        <div>
          <span class="eyebrow">Real Reviews, Real People</span>
          <h2 class="section-title">วิดีโอรีวิวจากนักเดินทางจริง</h2>
          <p class="section-sub">อยากรีวิวสถานที่ที่คุณไปมา? เปิดหน้ารายละเอียดสถานที่แล้วแนบวิดีโอได้เลย (ไม่เกิน 1 นาที)</p>
        </div>
      </div>

      <div class="videos-page__filters fade-in" id="videos-filters">
        <button class="videos-page__filter is-active" data-category="all">ทั้งหมด</button>
        <button class="videos-page__filter" data-category="cafe">คาเฟ่</button>
        <button class="videos-page__filter" data-category="restaurant">สายกิน</button>
        <button class="videos-page__filter" data-category="temple">วัด</button>
        <button class="videos-page__filter" data-category="mutelu">มูเตลู</button>
        <button class="videos-page__filter" data-category="shopping">ช้อปปิ้ง</button>
        <button class="videos-page__filter" data-category="culture">วัฒนธรรม</button>
        <button class="videos-page__filter" data-category="nature">ธรรมชาติ</button>
        <button class="videos-page__filter" data-category="fitness">ออกกำลังกาย</button>
      </div>

      <div class="videos-grid fade-in" id="videos-grid"><!-- filled by js/videos-page.js --></div>
    </div>
  </section>

  <!-- ================= FOOTER ================= -->
  <div data-include="/Fronend/components/footer.html"></div>

  <!-- ================= Scripts ================= -->
  <script src="/Fronend/js/i18n.js?v=44"></script>
  <script src="/Fronend/js/places-data.js?v=44"></script>
  <script src="/Fronend/js/reviews-data.js?v=44"></script>
  <script src="/Fronend/js/favorites-data.js?v=44"></script>
  <!-- Firebase Web SDK 10.13.2 (pinned, compat build) — Google Sign-In -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js?v=44"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js?v=44"></script>
  <script src="/Fronend/js/firebase.js?v=44"></script>
  <script src="/Fronend/js/api-client.js?v=44"></script>
  <script src="/Fronend/js/environment-data.js?v=44"></script>
  <script src="/Fronend/js/auth-state.js?v=44"></script>
  <script src="/Fronend/js/main.js?v=44"></script>
  <script src="/Fronend/js/navbar.js?v=44"></script>
  <script src="/Fronend/js/auth.js?v=44"></script>
  <script src="/Fronend/js/place-modal.js?v=44"></script>
  <script src="/Fronend/js/video-modal.js?v=44"></script>
  <script src="/Fronend/js/videos-page.js?v=44"></script>
  <!-- Chart.js 4.5.1 + SheetJS 0.20.3 (pinned) — Infobar's mini history chart + Excel download -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js?v=44"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js?v=44"></script>
  <script src="/Fronend/js/excel-export.js?v=44"></script>
  <script src="/Fronend/js/infobar.js?v=44"></script>
  <script src="/Fronend/js/mobile-shell.js?v=44"></script>
  <!-- ================= AI TOUR GUIDE ================= -->
  <div data-include="/Fronend/components/ai-tour-guide.html"></div>
  <script src="/Fronend/js/ai-tour-guide.js?v=44"></script>
</body>
</html>
