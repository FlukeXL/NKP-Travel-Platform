<header class="mnx-m-header" id="mnx-m-header">
  <div class="mnx-m-infobar" id="mnx-m-infobar" aria-label="ข้อมูลสภาพแวดล้อมเรียลไทม์">
    <!-- Brand pill -->
    <div class="mnx-m-infobar__brand">
      <span class="mnx-m-infobar__brand-dot"></span>
      <span class="mnx-m-infobar__brand-text">NKP</span>
    </div>

    <!-- Metrics row -->
    <div class="mnx-m-infobar__metrics">
      <button type="button" class="mnx-m-infobar__pill" data-metric="pm25">
        <span class="mnx-m-infobar__dot" id="mnx-m-env-dot"></span>
        <span class="mnx-m-infobar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="7" cy="9" r="1.3" />
            <circle cx="12" cy="7" r="1.7" />
            <circle cx="17" cy="10" r="1.1" />
            <path d="M4 15h16M5 18h14" />
          </svg></span>
        <span class="mnx-m-infobar__value" data-field="mnx-m-pm25-value">--</span>
      </button>
      <span class="mnx-m-infobar__sep"></span>
      <button type="button" class="mnx-m-infobar__pill" data-metric="weather">
        <span class="mnx-m-infobar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
          </svg></span>
        <span class="mnx-m-infobar__value" data-field="mnx-m-weather-value">--°</span>
      </button>
      <span class="mnx-m-infobar__sep"></span>
      <button type="button" class="mnx-m-infobar__pill" data-metric="mekong">
        <span class="mnx-m-infobar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9c1.5-1.3 3-1.3 4.5 0s3 1.3 4.5 0 3-1.3 4.5 0 3 1.3 4.5 0" />
            <path d="M3 15c1.5-1.3 3-1.3 4.5 0s3 1.3 4.5 0 3-1.3 4.5 0 3 1.3 4.5 0" />
          </svg></span>
        <span class="mnx-m-infobar__value" data-field="mnx-m-mekong-value">--</span>
      </button>
      <span class="mnx-m-infobar__sep"></span>
      <button type="button" class="mnx-m-infobar__pill" data-metric="traffic">
        <span class="mnx-m-infobar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 17v-4.5L7.5 8h9L18 12.5V17" />
            <path d="M5 17h14" />
            <circle cx="8.5" cy="17" r="1.4" />
            <circle cx="15.5" cy="17" r="1.4" />
          </svg></span>
        <span class="mnx-m-infobar__value" data-field="mnx-m-traffic-value">--</span>
      </button>
    </div>
  </div>
</header>
