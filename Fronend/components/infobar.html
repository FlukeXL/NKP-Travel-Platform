<section class="infobar" id="site-infobar" aria-label="ข้อมูลสภาพแวดล้อมเรียลไทม์">
  <div class="infobar__inner">

    <div class="infobar__card" data-metric="pm25">
      <span class="infobar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="9" r="1.3"/><circle cx="12" cy="7" r="1.7"/><circle cx="17" cy="10" r="1.1"/><path d="M4 15h16M5 18h14"/></svg></span>
      <span class="infobar__status-dot" data-field="pm25-dot"></span>
      <div class="infobar__body">
        <span class="infobar__label">PM2.5</span>
        <span class="infobar__value" data-field="pm25-value">-- <small>µg/m³</small></span>
      </div>
      <span class="infobar__chevron"><svg viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    </div>

    <div class="infobar__card" data-metric="weather">
      <span class="infobar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></span>
      <div class="infobar__body">
        <span class="infobar__label" data-i18n="infobar.weather">สภาพอากาศ</span>
        <span class="infobar__value" data-field="weather-temp">--°<small>C</small></span>
      </div>
      <span class="infobar__chevron"><svg viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    </div>

    <div class="infobar__card" data-metric="mekong">
      <span class="infobar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9c1.5-1.3 3-1.3 4.5 0s3 1.3 4.5 0 3-1.3 4.5 0 3 1.3 4.5 0"/><path d="M3 15c1.5-1.3 3-1.3 4.5 0s3 1.3 4.5 0 3-1.3 4.5 0 3 1.3 4.5 0"/></svg></span>
      <div class="infobar__body">
        <span class="infobar__label">แม่น้ำโขง</span>
        <span class="infobar__value" data-field="mekong-level">-- <small>ม.</small></span>
      </div>
      <span class="infobar__chevron"><svg viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    </div>

    <div class="infobar__card" data-metric="traffic">
      <span class="infobar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17v-4.5L7.5 8h9L18 12.5V17"/><path d="M5 17h14"/><circle cx="8.5" cy="17" r="1.4"/><circle cx="15.5" cy="17" r="1.4"/></svg></span>
      <span class="infobar__status-dot" data-field="traffic-dot"></span>
      <div class="infobar__body">
        <span class="infobar__label">จราจร</span>
        <!-- TODO(API): inject from Backend /api/traffic -->
        <span class="infobar__value" data-field="traffic-level">--</span>
      </div>
      <span class="infobar__chevron"><svg viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    </div>

  </div>

  <!-- Floating 7-day history panel (shared, content swapped by metric) -->
  <div class="infobar__panel" id="infobar-history-panel">
    <div class="infobar__panel-inner">
      <div class="infobar__panel-head">
        <h4 id="infobar-panel-title">ข้อมูลย้อนหลัง 7 วัน</h4>
        <button class="infobar__panel-close" id="infobar-panel-close" aria-label="ปิด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" width="14" height="14"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
      </div>
      <p class="infobar__panel-status" id="infobar-panel-status"></p>
      <canvas id="infobar-history-chart" height="90"></canvas>
      <div class="infobar__panel-actions" style="margin-top: 16px; justify-content: flex-end;">
        <button class="btn btn-outline btn-sm" id="infobar-download-chart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
          ดาวน์โหลด Excel
        </button>
      </div>
    </div>
  </div>
</section>
